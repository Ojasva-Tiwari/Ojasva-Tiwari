<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#08140B" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="neonTitleLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E8FFE8" />
      <stop offset="100%" stop-color="#39FF14" />
    </linearGradient>

    <!-- Subtle Divider Gradient -->
    <linearGradient id="divGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123D1B" stop-opacity="0" />
      <stop offset="30%" stop-color="#00FF66" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#39FF14" stop-opacity="1" />
      <stop offset="70%" stop-color="#00FF66" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#123D1B" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Central Glow -->
    <radialGradient id="centerGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Title -->
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dotGlowLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadowLight" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#071A0D" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Clean Dark Chassis with subtle border for high-contrast light mode viewing -->
  <rect x="2" y="2" width="1196" height="216" rx="12" fill="url(#bgGradLight)" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.7" filter="url(#cardShadowLight)" />

  <!-- Soft Ambient Glow behind Name -->
  <ellipse cx="600" cy="110" rx="420" ry="90" fill="url(#centerGlowLight)" />

  <!-- Corner Brackets (Minimal Accents) -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#39FF14" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 1184 32 L 1184 16 L 1168 16" fill="none" stroke="#39FF14" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 16 188 L 16 204 L 32 204" fill="none" stroke="#39FF14" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 1184 188 L 1184 204 L 1168 204" fill="none" stroke="#39FF14" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Main Identity (Centered & Minimal) -->
  <g text-anchor="middle">
    <!-- Top Minimal Status Line -->
    <g transform="translate(600, 48)">
      <circle cx="-105" cy="-4" r="3.5" fill="#39FF14" filter="url(#dotGlowLight)" />
      <text x="0" y="0" class="mono" font-size="11" fill="#39FF14" letter-spacing="3px" opacity="0.95">
        SYSTEM ACTIVE // PORTFOLIO
      </text>
    </g>

    <!-- Main Name -->
    <text x="600" y="116" class="sans" font-size="54" font-weight="900" fill="url(#neonTitleLight)" letter-spacing="6px" filter="url(#glowLight)">
      OJASVA TIWARI
    </text>

    <!-- Subtitle -->
    <text x="600" y="152" class="mono" font-size="14" font-weight="600" fill="#B6FF00" letter-spacing="5px">
      STUDENT  •  DEVELOPER  •  BUILDER
    </text>

    <!-- Thin Glowing Divider Line -->
    <line x1="420" y1="172" x2="780" y2="172" stroke="url(#divGradLight)" stroke-width="1.5" />

    <!-- Location & Focus Metadata -->
    <text x="600" y="196" class="mono" font-size="12" fill="#E8FFE8" letter-spacing="2px" opacity="0.9">
      Bangalore, IN   •   Web • AI • DSA
    </text>
  </g>
</svg>
